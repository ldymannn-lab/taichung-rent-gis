<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>崑鼎開發地產集團 · 大台中商用不動產租賃情資系統</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
        }
        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #0f172a;
            color: #f8fafc;
        }
        /* 頂部導覽列 */
        header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 48px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .header-title .tag {
            background: #0284c7;
            color: #fff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 400;
        }
        .header-status {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: #94a3b8;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #22c55e;
        }

        /* 管理員登入按鈕 */
        .admin-login-btn {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #94a3b8;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .admin-login-btn:hover {
            background: #334155;
            color: #f8fafc;
            border-color: #38bdf8;
        }
        .admin-login-btn.logged-in {
            background: rgba(34, 197, 94, 0.15);
            border-color: #22c55e;
            color: #4ade80;
        }

        /* 預設隱藏的檔案上傳區塊 */
        .admin-upload-area {
            display: none;
            align-items: center;
            gap: 8px;
        }
        .file-upload-btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: 1px solid #38bdf8;
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .file-upload-btn:hover {
            background: #0284c7;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        /* 地圖區域 */
        #map {
            width: 100%;
            height: 100%;
            padding-top: 48px;
            z-index: 1;
            background: #0f172a;
        }

        /* 右上角獨立底圖切換器 */
        .basemap-switcher {
            position: absolute;
            top: 58px;
            right: 14px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }
        .basemap-title {
            font-size: 11px;
            color: #94a3b8;
            padding: 2px 6px;
            font-weight: 600;
        }
        .basemap-btn {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 5px;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .basemap-btn:hover {
            background: #334155;
            color: #fff;
        }
        .basemap-btn.active {
            background: #0284c7;
            border-color: #38bdf8;
            color: #fff;
            font-weight: 600;
        }

        /* 左側側邊面板 */
        .sidebar {
            position: absolute;
            top: 58px;
            left: 12px;
            bottom: 12px;
            width: 325px;
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .store-header-box {
            background: linear-gradient(135deg, #b45309, #d97706, #f59e0b);
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        .store-header-title {
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .store-nav-btns {
            display: flex;
            gap: 4px;
        }
        .store-nav-btn {
            flex: 1;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fef08a;
            font-size: 11px;
            padding: 5px 2px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            font-weight: 700;
        }
        .store-nav-btn:hover {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border-color: #fff;
        }

        /* 搜尋欄位專屬樣式 */
        .search-section {
            padding: 10px 14px 4px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(15, 23, 42, 0.6);
        }
        .search-box-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-input {
            width: 100%;
            background: #1e293b;
            border: 1px solid #38bdf8;
            border-radius: 6px;
            padding: 7px 32px 7px 10px;
            font-size: 12px;
            color: #f8fafc;
            outline: none;
            transition: all 0.2s;
        }
        .search-input:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
            background: #0f172a;
        }
        .search-input::placeholder {
            color: #64748b;
        }
        .search-clear-btn {
            position: absolute;
            right: 8px;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
            display: none;
        }
        .search-clear-btn:hover {
            color: #fff;
        }

        .filter-container {
            padding: 10px 14px 12px 14px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .filter-group-title {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .btn-filter {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            padding: 6px 0;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .btn-filter:hover {
            background: #334155;
            color: #fff;
        }
        .btn-filter.active {
            background: #0284c7;
            border-color: #38bdf8;
            color: #fff;
            font-weight: 600;
        }

        /* 統計列表 */
        .stat-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 160px;
            overflow-y: auto;
        }
        .stat-item {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 6px 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .stat-item:hover, .stat-item.active {
            background: #0369a1;
            border-color: #38bdf8;
            color: #fff;
        }
        .stat-count {
            background: rgba(0, 0, 0, 0.35);
            padding: 2px 7px;
            border-radius: 10px;
            font-size: 11px;
            color: #38bdf8;
        }
        .stat-item.active .stat-count {
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
        }

        /* 底部狀態列 */
        .sidebar-footer {
            padding: 10px 14px;
            background: #0b1120;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
        }
        .sidebar-footer b {
            color: #38bdf8;
            font-size: 13px;
        }

        /* 實價租賃彈窗樣式 */
        .custom-popup .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.96);
            color: #f8fafc;
            border: 1px solid #38bdf8;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            padding: 4px;
        }
        .custom-popup .leaflet-popup-tip {
            background: rgba(15, 23, 42, 0.96);
        }
        .popup-header {
            font-size: 14px;
            font-weight: 700;
            color: #38bdf8;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            padding-bottom: 5px;
            margin-bottom: 8px;
        }
        .popup-row {
            font-size: 12px;
            margin: 4px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .popup-row span {
            color: #94a3b8;
        }
        .popup-rent-highlight {
            font-size: 17px;
            font-weight: 800;
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
            letter-spacing: 0.5px;
        }
        .popup-unit-highlight {
            font-size: 13px;
            font-weight: 700;
            color: #38bdf8;
        }

        .popup-note-box {
            margin-top: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 6px 8px;
        }
        .popup-note-preview {
            font-size: 11px;
            color: #cbd5e1;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .popup-note-expand-btn {
            display: block;
            margin-top: 5px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 11px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .popup-note-expand-btn:hover {
            background: #0284c7;
            color: #fff;
        }

        /* 全螢幕大字備註彈窗 (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100000;
            padding: 20px;
        }
        .modal-box {
            background: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
            overflow: hidden;
            animation: modalFadeIn 0.2s ease-out;
        }
        @keyframes modalFadeIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-header {
            background: #0f172a;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .modal-header h4 {
            color: #38bdf8;
            font-size: 15px;
            font-weight: 700;
        }
        .modal-close-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
        }
        .modal-close-btn:hover {
            color: #fff;
        }
        .modal-body {
            padding: 18px 20px;
            max-height: 380px;
            overflow-y: auto;
            color: #f1f5f9;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .modal-footer {
            background: #0f172a;
            padding: 10px 16px;
            text-align: right;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .modal-btn-confirm {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .modal-btn-confirm:hover {
            background: #0369a1;
        }

        /* 樹狀展開點點樣式 */
        .pin-cluster-item {
            width: 16px;
            height: 16px;
            background: radial-gradient(circle, #22d3ee 0%, #0284c7 100%);
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px #0284c7, 0 0 14px rgba(34, 211, 238, 0.8);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .pin-cluster-item:hover {
            transform: scale(1.3);
            border-color: #fef08a;
            background: #38bdf8;
        }

        /* 門市專屬旗艦地標樣式 (金色光芒脈衝) */
        .store-marker-container {
            position: relative;
            width: 38px;
            height: 38px;
            cursor: pointer;
        }
        .store-marker-pin {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: 2px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.7);
            position: relative;
            z-index: 2;
        }
        .store-marker-pulse {
            position: absolute;
            top: -6px;
            left: -6px;
            width: 50px;
            height: 50px;
            background: rgba(245, 158, 11, 0.45);
            border-radius: 50%;
            animation: storePulse 2s infinite ease-out;
            z-index: 1;
        }
        @keyframes storePulse {
            0% { transform: scale(0.6); opacity: 0.9; }
            70% { transform: scale(1.4); opacity: 0; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        /* 門市尊爵彈窗 */
        .company-popup .leaflet-popup-content-wrapper {
            background: #172033;
            color: #fff;
            border: 2px solid #f59e0b;
            border-radius: 12px;
            padding: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .company-popup .leaflet-popup-tip {
            background: #172033;
        }
        .company-card {
            min-width: 270px;
            padding: 6px;
        }
        .company-badge-box {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid #f59e0b;
            border-radius: 6px;
            padding: 6px 10px;
            text-align: center;
            margin-bottom: 10px;
        }
        .company-sub {
            font-size: 10px;
            letter-spacing: 1.5px;
            color: #fbbf24;
            font-weight: 700;
        }
        .company-name {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            margin: 2px 0;
        }
        .company-slogan {
            font-size: 11px;
            color: #94a3b8;
        }

        .recruit-glow-banner {
            background: linear-gradient(90deg, #b45309, #d97706, #b45309);
            background-size: 200% auto;
            border: 2px solid #fef08a;
            border-radius: 8px;
            padding: 10px 6px;
            text-align: center;
            color: #ffffff;
            font-size: 17px;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 10px 0;
            box-shadow: 0 0 18px rgba(245, 158, 11, 0.9);
            animation: glowAnimate 2.5s infinite alternate;
        }
        @keyframes glowAnimate {
            0% { box-shadow: 0 0 10px #f59e0b; transform: scale(0.99); }
            100% { box-shadow: 0 0 24px #fef08a, 0 0 35px #f59e0b; transform: scale(1.02); }
        }

        .company-info-list {
            font-size: 12px;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 10px 0;
            background: rgba(0,0,0,0.25);
            padding: 8px 10px;
            border-radius: 6px;
        }
        .company-info-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .company-contact-btn {
            display: block;
            background: linear-gradient(135deg, #d97706, #f59e0b);
            color: #1e1b4b;
            font-weight: 800;
            font-size: 13px;
            text-align: center;
            padding: 8px 0;
            border-radius: 6px;
            text-decoration: none;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
            transition: all 0.2s;
        }
        .company-contact-btn:hover {
            background: #fbbf24;
            color: #000;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <span>崑鼎開發地產集團 · 大台中商用不動產租賃情資系統</span>
            <span class="tag">空間精確定位版</span>
        </div>
        <div class="header-status">
            <span><span class="status-dot"></span> 系統已連線</span>
            <span id="loadSummary">載入中...</span>

            <!-- 管理員更新區塊 -->
            <div id="adminUploadArea" class="admin-upload-area">
                <label class="file-upload-btn">
                    📂 管理員更新 CSV
                    <input type="file" id="csvFileInput" accept=".csv" style="display: none;">
                </label>
            </div>

            <!-- 登入驗證鈕 -->
            <button id="adminLoginBtn" class="admin-login-btn" onclick="handleAdminAuth()">
                🔒 管理員登入
            </button>
        </div>
    </header>

    <!-- 右上角獨立圖資切換器 -->
    <div class="basemap-switcher">
        <div class="basemap-title">🗺️ 圖資模式</div>
        <div class="basemap-btn active" id="btn-emap" onclick="switchBaseMap('emap')">
            <span>📍</span> 臺灣通用電子地圖
        </div>
        <div class="basemap-btn" id="btn-photo" onclick="switchBaseMap('photo')">
            <span>🛰️</span> 衛星空拍航照圖
        </div>
        <div class="basemap-btn" id="btn-dark" onclick="switchBaseMap('dark')">
            <span>🌙</span> 科技深色模式
        </div>
    </div>

    <!-- 左側商情控制面板 -->
    <div class="sidebar">
        <!-- 門市導航卡片 -->
        <div class="store-header-box">
            <div class="store-header-title">
                <span>🏆 崑鼎團隊 · 旗艦門市</span>
                <span style="font-size: 11px; opacity: 0.9;">點選導航</span>
            </div>
            <div class="store-nav-btns">
                <button class="store-nav-btn" onclick="focusStore(0)">14期崇德統富</button>
                <button class="store-nav-btn" onclick="focusStore(1)">823公園店</button>
                <button class="store-nav-btn" onclick="focusStore(2)">水湳生態公園</button>
            </div>
        </div>

        <!-- 關鍵字路段 / 門牌即時搜尋欄位 -->
        <div class="search-section">
            <div class="filter-group-title" style="margin-bottom: 5px;">
                <span>🔍 路段 / 門牌快速跳轉</span>
            </div>
            <div class="search-box-wrapper">
                <input type="text" id="keywordSearchInput" class="search-input" placeholder="例：崇德路三段、豐樂路...">
                <button id="searchClearBtn" class="search-clear-btn" onclick="clearKeywordSearch()">&times;</button>
            </div>
        </div>

        <div class="filter-container">
            <!-- 物件型態篩選 -->
            <div>
                <div class="filter-group-title">租賃物件型態</div>
                <div class="btn-grid" id="typeFilters">
                    <div class="btn-filter active" data-type="ALL">全部</div>
                    <div class="btn-filter" data-type="店面">店面</div>
                    <div class="btn-filter" data-type="住家">住家</div>
                    <div class="btn-filter" data-type="透天">透天</div>
                </div>
            </div>

            <!-- 交易時間 (民國年) -->
            <div>
                <div class="filter-group-title">交易時間 (民國年)</div>
                <div class="btn-grid" id="yearFilters" style="grid-template-columns: repeat(4, 1fr);">
                    <div class="btn-filter active" data-year="ALL">全部</div>
                    <div class="btn-filter" data-year="114">114 年</div>
                    <div class="btn-filter" data-year="113">113 年</div>
                    <div class="btn-filter" data-year="112">112 年</div>
                </div>
            </div>

            <!-- 行政區篩選清單 -->
            <div>
                <div class="filter-group-title">
                    <span>行政區篩選</span>
                    <span style="font-size: 11px; cursor: pointer; color: #38bdf8;" onclick="resetDistrictFilter()">清除</span>
                </div>
                <div class="stat-list" id="districtList"></div>
            </div>

            <!-- 核心商圈路段 -->
            <div>
                <div class="filter-group-title">
                    <span>核心租賃路段 (依筆數)</span>
                    <span style="font-size: 11px; cursor: pointer; color: #38bdf8;" onclick="resetRoadFilter()">清除</span>
                </div>
                <div class="stat-list" id="roadList"></div>
            </div>
        </div>

        <div class="sidebar-footer">
            <span>符合條件筆數：<b id="filteredCount">0</b></span>
            <span>地圖標註：<b id="markerCount">0</b> 點</span>
        </div>
    </div>

    <div id="map"></div>

    <!-- 備註獨立放大彈窗 (Modal) -->
    <div id="noteModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h4 id="modalAddressTitle">門牌位置</h4>
                <button class="modal-close-btn" onclick="closeNoteModal()">&times;</button>
            </div>
            <div id="modalNoteContent" class="modal-body"></div>
            <div class="modal-footer">
                <button class="modal-btn-confirm" onclick="closeNoteModal()">關閉</button>
            </div>
        </div>
    </div>

    <!-- Leaflet & MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script>
        // ==================== 管理員密碼機制 ====================
        const ADMIN_PASSWORD = "8888";
        let isAdminLoggedIn = false;

        function handleAdminAuth() {
            if (isAdminLoggedIn) {
                if (confirm("是否要登出管理員模式？")) {
                    isAdminLoggedIn = false;
                    document.getElementById('adminUploadArea').style.display = 'none';
                    const btn = document.getElementById('adminLoginBtn');
                    btn.classList.remove('logged-in');
                    btn.innerHTML = '🔒 管理員登入';
                }
                return;
            }

            const inputPwd = prompt("請輸入管理員解鎖密碼：");
            if (inputPwd === null) return;

            if (inputPwd === ADMIN_PASSWORD) {
                isAdminLoggedIn = true;
                document.getElementById('adminUploadArea').style.display = 'inline-flex';
                const btn = document.getElementById('adminLoginBtn');
                btn.classList.add('logged-in');
                btn.innerHTML = '🔓 已解鎖 (點擊登出)';
                alert("驗證成功！已開啟 CSV 資料更換功能。");
            } else {
                alert("密碼錯誤，無法解鎖！");
            }
        }

        // ==================== 備註放大 Modal 功能 ====================
        function openNoteModal(address, note) {
            document.getElementById('modalAddressTitle').innerText = address;
            document.getElementById('modalNoteContent').innerText = note;
            document.getElementById('noteModal').style.display = 'flex';
        }

        function closeNoteModal() {
            document.getElementById('noteModal').style.display = 'none';
        }

        // ==================== 地圖初始化 ====================
        const map = L.map('map', {
            center: [24.196490, 120.676177],
            zoom: 14,
            zoomControl: false
        });
        L.control.zoom({ position: 'topright' }).addTo(map);

        const emapLayer = L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://maps.nlsc.gov.tw/" target="_blank">內政部國土測繪中心</a>'
        });

        const photoLayer = L.tileLayer('https://wmts.nlsc.gov.tw/wmts/PHOTO2/default/GoogleMapsCompatible/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://maps.nlsc.gov.tw/" target="_blank">內政部國土測繪中心</a>'
        });

        const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            subdomains: 'abcd',
            attribution: '&copy; CARTO'
        });

        emapLayer.addTo(map);

        function switchBaseMap(type) {
            document.querySelectorAll('.basemap-btn').forEach(btn => btn.classList.remove('active'));
            map.removeLayer(emapLayer);
            map.removeLayer(photoLayer);
            map.removeLayer(darkLayer);

            if (type === 'photo') {
                photoLayer.addTo(map);
                document.getElementById('btn-photo').classList.add('active');
            } else if (type === 'dark') {
                darkLayer.addTo(map);
                document.getElementById('btn-dark').classList.add('active');
            } else {
                emapLayer.addTo(map);
                document.getElementById('btn-emap').classList.add('active');
            }
        }

        // ==================== 常駐旗艦門市 (獨立圖層) ====================
        const storeData = [
            {
                name: "永慶不動產 14期崇德統富加盟店",
                sub: "TAICHUNG FLAGSHIP CENTER",
                desc: "大台中商用不動產情報觀測中樞",
                address: "台中市北屯區崇德十路二段466號",
                phone: "04-2422-4788",
                contact: "面試請洽 羅典佑 協理 / 尤國正 協理",
                callNum: "tel:0424224788",
                lat: 24.19649014484265,
                lng: 120.67617705041023
            },
            {
                name: "永慶不動產 823公園加盟店",
                sub: "BEITUN 823 PARK BRANCH",
                desc: "11期/14期 公園第一排核心旗艦",
                address: "台中市北屯區崇德十路二段390號",
                phone: "04-2422-6499",
                contact: "面試請洽 洪榮祺 協理",
                callNum: "tel:0424226499",
                lat: 24.18871296462887,
                lng: 120.68858245040998
            },
            {
                name: "永義房屋 水湳生態公園加盟店",
                sub: "SHUINAN ECO PARK BRANCH",
                desc: "水湳經貿特區生態公園前瞻旗艦",
                address: "台中市北屯區崇德六路582號",
                phone: "04-2422-4788",
                contact: "面試請洽 張和生 協理",
                callNum: "tel:0424224788",
                lat: 24.18079336891453,
                lng: 120.67755601295076
            }
        ];

        const storeMarkers = [];

        function renderCompanyStores() {
            storeData.forEach((st, idx) => {
                const storeIcon = L.divIcon({
                    className: 'custom-store-pin',
                    html: `
                        <div class="store-marker-container">
                            <div class="store-marker-pulse"></div>
                            <div class="store-marker-pin">🏢</div>
                        </div>
                    `,
                    iconSize: [38, 38],
                    iconAnchor: [19, 19]
                });

                const marker = L.marker([st.lat, st.lng], { 
                    icon: storeIcon,
                    zIndexOffset: 100000 
                }).addTo(map);

                marker.bindPopup(`
                    <div class="company-card">
                        <div class="company-badge-box">
                            <div class="company-sub">${st.sub}</div>
                            <div class="company-name">${st.name}</div>
                            <div class="company-slogan">${st.desc}</div>
                        </div>

                        <div class="recruit-glow-banner">
                            🔥 崑鼎人才招募中 🔥
                        </div>

                        <div class="company-info-list">
                            <div class="company-info-item"><span>📍</span> <b>門市地址：</b>${st.address}</div>
                            <div class="company-info-item"><span>📞</span> <b>代表號：</b>${st.phone}</div>
                        </div>

                        <a href="${st.callNum}" class="company-contact-btn">
                            📞 ${st.contact}
                        </a>
                    </div>
                `, { className: 'company-popup', maxWidth: 330 });

                storeMarkers.push(marker);

                if (idx === 0) {
                    setTimeout(() => {
                        marker.openPopup();
                    }, 600);
                }
            });
        }

        renderCompanyStores();

        function focusStore(index) {
            const st = storeData[index];
            const marker = storeMarkers[index];
            if (st && marker) {
                map.flyTo([st.lat, st.lng], 16.5, {
                    animate: true,
                    duration: 1.2
                });
                setTimeout(() => {
                    marker.openPopup();
                }, 1300);
            }
        }

        // ==================== 樹狀同點位展開 (Spiderfy) ====================
        const markersCluster = L.markerClusterGroup({
            chunkedLoading: true,
            maxClusterRadius: 40,
            spiderfyOnMaxZoom: true,
            showCoverageOnHover: false,
            spiderfyDistanceMultiplier: 2.5,
            spiderLegPolylineOptions: {
                weight: 2.5,
                color: '#38bdf8',
                opacity: 0.85
            }
        });
        map.addLayer(markersCluster);

        let rawData = [];
        let activeFilters = {
            type: 'ALL',
            year: 'ALL',
            district: 'ALL',
            road: 'ALL',
            keyword: ''
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadCSVFile('data.csv');
            initKeywordSearch();
        });

        document.getElementById('csvFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        processData(results.data);
                    }
                });
            }
        });

        function loadCSVFile(url) {
            Papa.parse(url, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    processData(results.data);
                },
                error: function(err) {
                    document.getElementById('loadSummary').innerText = '展示模式：請登入管理員以更新資料';
                }
            });
        }

        function processData(data) {
            rawData = data.filter(d => {
                const lat = parseFloat(d.lat);
                const lng = parseFloat(d.lng);
                return !isNaN(lat) && !isNaN(lng) && lat > 23.5 && lat < 24.6 && lng > 120.3 && lng < 121.2;
            });

            document.getElementById('loadSummary').innerText = `已載入 ${rawData.length.toLocaleString()} 筆精確標的`;
            renderDistricts();
            applyFilters(false);
        }

        // ==================== 關鍵字快速搜尋功能 ====================
        function initKeywordSearch() {
            const input = document.getElementById('keywordSearchInput');
            const clearBtn = document.getElementById('searchClearBtn');

            input.addEventListener('input', function() {
                const val = this.value.trim();
                clearBtn.style.display = val.length > 0 ? 'block' : 'none';
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    executeKeywordSearch();
                }
            });
        }

        function executeKeywordSearch() {
            const input = document.getElementById('keywordSearchInput');
            const kw = input.value.trim();
            activeFilters.keyword = kw;
            // 執行篩選並平滑自動飛航跳轉視角
            applyFilters(true);
        }

        function clearKeywordSearch() {
            const input = document.getElementById('keywordSearchInput');
            input.value = '';
            document.getElementById('searchClearBtn').style.display = 'none';
            activeFilters.keyword = '';
            applyFilters(false);
        }

        function renderDistricts() {
            const distMap = {};
            rawData.forEach(d => {
                const dist = d['鄉鎮市區'] || '其他';
                distMap[dist] = (distMap[dist] || 0) + 1;
            });

            const sorted = Object.entries(distMap).sort((a, b) => b[1] - a[1]);
            const container = document.getElementById('districtList');
            container.innerHTML = `
                <div class="stat-item ${activeFilters.district === 'ALL' ? 'active' : ''}" onclick="selectDistrict('ALL')">
                    <span>全台中市</span>
                    <span class="stat-count">${rawData.length.toLocaleString()}</span>
                </div>
            `;

            sorted.forEach(([dist, count]) => {
                container.innerHTML += `
                    <div class="stat-item ${activeFilters.district === dist ? 'active' : ''}" onclick="selectDistrict('${dist}')">
                        <span>${dist}</span>
                        <span class="stat-count">${count.toLocaleString()}</span>
                    </div>
                `;
            });
        }

        function renderRoads(filtered) {
            const roadMap = {};
            filtered.forEach(d => {
                const addr = d['土地區段位置-建物區段門牌'] || d['Response_Address'] || '';
                const match = addr.match(/(.+?[路街道段])/);
                if (match) {
                    let road = match[1].replace(/臺中市.*?區/, '');
                    if (road.length >= 2 && road.length <= 8) {
                        roadMap[road] = (roadMap[road] || 0) + 1;
                    }
                }
            });

            const sorted = Object.entries(roadMap).sort((a, b) => b[1] - a[1]).slice(0, 15);
            const container = document.getElementById('roadList');
            container.innerHTML = '';

            if (sorted.length === 0) {
                container.innerHTML = '<div style="color:#64748b;font-size:12px;padding:4px;">無路段統計</div>';
                return;
            }

            sorted.forEach(([road, count]) => {
                container.innerHTML += `
                    <div class="stat-item ${activeFilters.road === road ? 'active' : ''}" onclick="selectRoad('${road}')">
                        <span>${road}</span>
                        <span class="stat-count">${count.toLocaleString()}</span>
                    </div>
                `;
            });
        }

        function applyFilters(shouldZoomToResult = false) {
            let filtered = rawData.filter(d => {
                const use = d['主要用途'] || '';
                const btype = d['建物型態'] || '';
                const target = d['交易標的'] || '';
                const addr = (d['土地區段位置-建物區段門牌'] || '') + ' ' + (d['Response_Address'] || '');

                // 關鍵字搜尋比對
                if (activeFilters.keyword !== '') {
                    if (!addr.includes(activeFilters.keyword)) return false;
                }

                // 物件型態篩選
                if (activeFilters.type !== 'ALL') {
                    if (activeFilters.type === '店面') {
                        if (!(use.includes('店') || use.includes('商') || target.includes('店') || btype.includes('店') || btype.includes('辦公'))) return false;
                    } else if (activeFilters.type === '住家') {
                        if (!(use.includes('住') || btype.includes('住宅') || btype.includes('大樓') || btype.includes('公寓') || btype.includes('華廈') || btype.includes('套房'))) return false;
                    } else if (activeFilters.type === '透天') {
                        if (!btype.includes('透天')) return false;
                    }
                }

                // 交易年份篩選
                if (activeFilters.year !== 'ALL') {
                    const dateStr = String(d['民國年月'] || '').trim();
                    if (!dateStr.startsWith(activeFilters.year)) return false;
                }

                // 行政區篩選
                if (activeFilters.district !== 'ALL' && d['鄉鎮市區'] !== activeFilters.district) {
                    return false;
                }

                // 核心路段清單篩選
                if (activeFilters.road !== 'ALL') {
                    if (!addr.includes(activeFilters.road)) return false;
                }

                return true;
            });

            document.getElementById('filteredCount').innerText = filtered.length.toLocaleString();
            document.getElementById('markerCount').innerText = filtered.length.toLocaleString();

            renderRoads(filtered);
            renderMarkers(filtered, shouldZoomToResult);
        }

        // ==================== 繪製點位 ====================
        function renderMarkers(items, shouldZoomToResult = false) {
            markersCluster.clearLayers();
            const markers = [];

            const markerIcon = L.divIcon({
                className: 'custom-pin-wrapper',
                html: `<div class="pin-cluster-item"></div>`,
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });

            items.forEach(d => {
                const lat = parseFloat(d.lat);
                const lng = parseFloat(d.lng);
                const marker = L.marker([lat, lng], { icon: markerIcon });

                // 1. 月租金格式化
                const rawPrice = parseFloat(d['總價-元']);
                const rentStr = !isNaN(rawPrice) && rawPrice > 0 
                    ? `$ ${rawPrice.toLocaleString()} <span style="font-size:12px;font-weight:400;color:#cbd5e1;">元/月</span>` 
                    : '未揭露';

                // 2. 每坪月租金
                const rawUnit = parseFloat(d['單價-每平方公尺']);
                const unitRentStr = !isNaN(rawUnit) && rawUnit > 0
                    ? `$ ${(rawUnit * 3.30578).toFixed(0)} <span style="font-size:11px;font-weight:400;color:#94a3b8;">元/坪/月</span>`
                    : '未揭露';

                // 3. 承租坪數 (第二位為0則只顯示一位)
                const rawArea = parseFloat(d['建物移轉總面積-平方公尺']);
                let areaStr = '-';
                if (!isNaN(rawArea) && rawArea > 0) {
                    let ping = (rawArea * 0.3025).toFixed(2);
                    if (ping.endsWith('0')) {
                        ping = ping.slice(0, -1);
                    }
                    areaStr = `${ping} 坪`;
                }

                // 4. 正確拆解民國年月
                let dateStr = '-';
                if (d['民國年月']) {
                    const rawDate = String(d['民國年月']).trim();
                    if (rawDate.length >= 6) {
                        const y = rawDate.slice(0, -4);
                        const m = parseInt(rawDate.slice(-4, -2), 10);
                        dateStr = `民國 ${y} 年 ${m} 月`;
                    } else if (rawDate.length >= 4) {
                        const y = rawDate.slice(0, -2);
                        const m = parseInt(rawDate.slice(-2), 10);
                        dateStr = `民國 ${y} 年 ${m} 月`;
                    }
                }

                // 5. 樓層顯示修正
                const rawFloor = d['移轉層次'] || '-';
                let totalFloor = d['總層數'] ? String(d['總層數']).replace(/\.0+$/, '') : '-';
                let floor = totalFloor !== '-' ? `${rawFloor} / ${totalFloor}F` : rawFloor;
                floor = floor.replace(/\.0+F/g, 'F');

                const address = d['土地區段位置-建物區段門牌'] || d['Response_Address'];
                const note = (d['備註'] && d['備註'].trim() !== '') ? d['備註'].trim() : '無特殊備註';

                const safeNote = note.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safeAddress = address.replace(/'/g, "\\'").replace(/"/g, '&quot;');

                marker.bindPopup(`
                    <div class="popup-header">${address}</div>
                    <div class="popup-row">
                        <span>月租金</span>
                        <div class="popup-rent-highlight">${rentStr}</div>
                    </div>
                    <div class="popup-row">
                        <span>坪效單價</span>
                        <div class="popup-unit-highlight">${unitRentStr}</div>
                    </div>
                    <div class="popup-row"><span>承租坪數</span><span style="font-weight:600;color:#f8fafc;">${areaStr}</span></div>
                    <div class="popup-row"><span>承租樓層</span><span>${floor}</span></div>
                    <div class="popup-row"><span>交易年月</span><span style="color:#e2e8f0;font-weight:600;">${dateStr}</span></div>
                    <div class="popup-row"><span>建物型態</span><span>${d['建物型態'] || d['主要用途'] || '房屋租賃'}</span></div>
                    
                    <div class="popup-note-box">
                        <div class="popup-note-preview"><b>備註：</b>${note}</div>
                        ${note !== '無特殊備註' ? `<button class="popup-note-expand-btn" onclick="openNoteModal('${safeAddress}', '${safeNote}')">🔍 點擊查看完整備註 (放大檢視)</button>` : ''}
                    </div>
                `, { className: 'custom-popup' });

                markers.push(marker);
            });

            markersCluster.addLayers(markers);

            // 當由關鍵字搜尋或行政區點擊觸發時，自動平滑飛航聚焦
            if ((shouldZoomToResult || activeFilters.district !== 'ALL') && markers.length > 0) {
                const group = new L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.12), {
                    animate: true,
                    duration: 1.0,
                    maxZoom: 16
                });
            }
        }

        // ==================== 篩選按鈕事件綁定 ====================
        document.querySelectorAll('#typeFilters .btn-filter').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#typeFilters .btn-filter').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                activeFilters.type = this.dataset.type;
                applyFilters(false);
            });
        });

        document.querySelectorAll('#yearFilters .btn-filter').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#yearFilters .btn-filter').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                activeFilters.year = this.dataset.year;
                applyFilters(false);
            });
        });

        function selectDistrict(dist) {
            activeFilters.district = dist;
            renderDistricts();
            applyFilters(true);
        }

        function resetDistrictFilter() {
            selectDistrict('ALL');
        }

        function selectRoad(road) {
            activeFilters.road = road;
            applyFilters(true);
        }

        function resetRoadFilter() {
            activeFilters.road = 'ALL';
            applyFilters(false);
        }
    </script>
</body>
</html>
